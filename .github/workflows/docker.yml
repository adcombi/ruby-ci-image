name: Build Ruby CI image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - bin/entrypoint.sh
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - bin/entrypoint.sh
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ruby-ci-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

jobs:
  ruby-3-4-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          build-args: ruby_version=3.4.12
          tags: |
            ghcr.io/adcombi/ruby-ci-image:3.4.12
            ghcr.io/adcombi/ruby-ci-image:3.4
            ghcr.io/adcombi/ruby-ci-image:3.4.12-${{ github.sha }}
          provenance: true
          sbom: true
