name: Build and Push Ruby CI Image

on:
  push:
    branches: [ "main" ]
    tags:
      - "deploy-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adcombi/ruby-ci-image

jobs:
  build:
    name: Build and push ${{ matrix.ruby_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["2.7.6", "3.1.3", "3.2.2", "3.3.4", "3.4.5", "3.4.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          ./build_push.sh ${{ matrix.ruby_version }}
